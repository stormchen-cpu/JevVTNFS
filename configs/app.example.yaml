app:
  database_path: "var/triage.db"
  raw_dir: "var/raw"
  reports_dir: "var/reports"
  datasets_dir: "var/datasets"
  models_dir: "var/models"
  default_timezone: "Asia/Taipei"
  log_level: "INFO"

policy_file: "configs/policy.example.yaml"
egress_file: "configs/egress.example.yaml"

backend:
  type: "gemini-decision"  # 'fake', 'api', 'local', or 'gemini-decision'
  api_provider: "google-gemini-decisions"
  api_base_url: "https://generativelanguage.googleapis.com/v1beta"
  model_name: "gemini-decision-1"
  timeout_seconds: 15
  max_retries: 2
  confidence_threshold: 0.80
  fallback_to_mock: true

