[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-triage"
version = "0.1.0"
description = "Vulnerability Triage and Noise Filtering System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Engineering Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
triage = "vuln_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
